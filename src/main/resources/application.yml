spring:
  webflux:
    base-path: /api

  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true

  profiles:
    active:
    - ${SPRING_PROFILES_ACTIVE}

  application:
    name: 01-WebFlux
  
logging:
  level:
    '[org.springframework]': debug
    '[io.r2dbc.postgresql]': debug
    root: debug
  file:
    name: logger.log
    

server:
  port: 8080

refresh-token:
  ttl: 30d 

email-expiration:
  time: 15m
